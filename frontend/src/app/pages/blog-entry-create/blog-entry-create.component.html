<div class="container">
    <input type="file" (change)="onFileSelected($event)">
    <form [formGroup]="theForm" (ngSubmit)="onSubmit()">
        Blog Entry Image: <input formControlName="image"><br>
        Blog Entry Title: <input formControlName="title"><br>
        Blog Entry: <textarea formControlName="blogText"></textarea><br>
        Blog Entry Summary: <input formControlName="summary">
        <button type="submit" [disabled]="!theForm.valid">Submit</button>    
    </form>    
</div>
