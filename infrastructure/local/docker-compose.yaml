services:

  dynamodb:
    image: amazon/dynamodb-local
    container_name: dynamodb-local
    ports:
      - "8000:8000"

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  
  dynamodb-init:
    image: amazon/aws-cli
    depends_on:
      - dynamodb
    volumes:
      - ./:/workspace    
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      AWS_DEFAULT_REGION: us-east-1        
    entrypoint:
      - /bin/sh 
      - -c 
      - |
        until aws dynamodb list-tables \
          --endpoint-url http://dynamodb:8000 \
          --region us-east-1; do
            echo waiting for dynamodb...
            sleep 2;
        done;
        aws dynamodb create-table \
        --cli-input-yaml file:///workspace/post-table.yaml \
        --endpoint-url http://dynamodb:8000 \
        --region us-east-1;
      

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 admin password123) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb local/angular-blog-dev-assets --ignore-existing;
      /usr/bin/mc anonymous set public local/angular-blog-dev-assets;
      exit 0;
      "

volumes:
  minio_data: